name = "spawnlab-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "JOBS"
id = "<KV_NAMESPACE_ID>"
preview_id = "<KV_PREVIEW_ID>"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "spawnlab-assets"

[triggers]
crons = ["* * * * *"]

[vars]
WORKER_URL = "https://spawnlab-worker.<your-subdomain>.workers.dev"

# Secrets (set via: wrangler secret put <NAME>)
# WORKER_SECRET  — shared secret between CF Worker and GPU workers
